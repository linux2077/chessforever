# Netlify build for CHESSBAR (TanStack Start + Nitro).
# vite.config.ts switches the Nitro preset to "netlify" when NETLIFY=true,
# emitting Netlify Functions + static assets.
[build]
  command = "bun install && bun run build"
  publish = "dist"

[build.environment]
  NETLIFY = "true"
  NODE_VERSION = "22"
  BUN_VERSION = "1.2.19"

[functions]
  node_bundler = "esbuild"

# SPA fallback: let the TanStack Start server handle every route.
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/server"
  status = 200
  force = false
